<form class="dph-filtros" method="get">
    <div class="row g-2 align-items-end">
        <div class="col-6 col-md-2"><label class="form-label">Fecha de corte</label>
            <input type="date" class="form-control form-control-sm" name="corte" value="{{ ctx.corte|date:'Y-m-d' }}">
        </div>
        <div class="col-6 col-md-3"><label class="form-label">Empresa</label>
            <select class="form-select form-select-sm" name="empresa">
                <option value="">Todas</option>
                {% for e in empresas %}
                <option value="{{ e.ruc }}" {% if ctx.empresa.ruc == e.ruc %}selected{% endif %}>{{ e.nombre_corto }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6 col-md-3"><label class="form-label">Proyecto / centro de costo</label>
            <select class="form-select form-select-sm" name="proyecto">
                <option value="">Todos</option>
                {% for p in proyectos %}
                <option value="{{ p.cc2 }}" {% if ctx.proyecto.cc2 == p.cc2 %}selected{% endif %}>{{ p.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6 col-md-2">
            <div class="form-check mt-4">
                {% if not ctx.incluir_personal %}
                <input class="form-check-input" type="checkbox" id="personal" name="personal" value="0" checked>
                {% else %}
                <input class="form-check-input" type="checkbox" id="personal" name="personal" value="0">
                {% endif %}
                <label class="form-check-label small" for="personal">Sin deuda personal</label>
            </div>
        </div>
        <div class="col-12 col-md-2 d-flex gap-2">
            <button class="btn btn-sm dph-btn flex-fill" type="submit"><i class="bi bi-funnel"></i> Aplicar</button>
            <a class="btn btn-sm btn-outline-secondary" href="?" title="Quitar filtros"><i class="bi bi-x-lg"></i></a>
        </div>
    </div>
</form>
