{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card dph-card">
            <div class="card-body">
                <h1 class="h4 dph-titulo mb-3">Cuadro de mando</h1>
                {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
                <form method="post">{% csrf_token %}
                    <div class="mb-3"><label class="form-label" for="id_username">Usuario</label>
                        <input class="form-control" id="id_username" name="username" autofocus required>
                    </div>
                    <div class="mb-3"><label class="form-label" for="id_password">Contraseña</label>
                        <input class="form-control" id="id_password" name="password" type="password" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button class="btn dph-btn w-100" type="submit">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
